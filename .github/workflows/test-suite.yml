name: Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  HEADLESS: 'true'
  ECOM_SPECS: >-
    src/tests/ui/registration.spec.ts
    src/tests/ui/ecommerce-login.spec.ts
    src/tests/ui/products-and-cart.spec.ts
    src/tests/ui/checkout-and-orders.spec.ts
    src/tests/ui/contact-form.spec.ts

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  e-commerce:
    name: E-Commerce UI Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=ui ${{ env.ECOM_SPECS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecommerce-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
